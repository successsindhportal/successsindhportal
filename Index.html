<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUCCESS SINDH PORTAL - Way to Success</title>
<meta name="description" content="SUCCESS SINDH PORTAL: student registration for Olympiads and scholarships in Sindh. Create your student account, apply online, get your challan and admit slip.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="SUCCESS SINDH PORTAL - Way to Success">
<meta property="og:description" content="Student registration for Olympiads and scholarships in Sindh.">
<meta name="theme-color" content="#0a2552">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@600&family=Noto+Nastaliq+Urdu:wght@400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1d5fd8; --green-dark: #0a2552; --green-soft: #eaf1fc; --mint: #f0f5fd;
    --gold: #d9a826; --gold-soft: #fbf1d3;
    --paper: #f4f7fc; --ink: #13233f; --muted: #5b6b86; --line: #cfdcf2;
    --danger: #c0312b; --danger-soft: #fdeceb; --ok: #17804a;
    --shadow: 0 10px 30px rgba(1, 65, 28, .10);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--paper); line-height: 1.55; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Top bar */
  .nav { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .nav-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .emblem { width: 42px; height: 42px; flex: none; }
  .brand-t { font-weight: 800; letter-spacing: .02em; color: var(--green-dark); line-height: 1.1; font-size: 1.02rem; }
  .brand-s { font-size: .78rem; color: var(--gold); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 56px; }

  /* Buttons */
  .btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; background: var(--green); color: #fff; padding: 13px 26px; border-radius: 12px; transition: background .15s, transform .1s, box-shadow .15s; white-space: nowrap; box-shadow: 0 6px 16px rgba(29,95,216,.25); }
  .btn:hover { background: var(--green-dark); }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .6; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--green-dark); border: 1.5px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { background: var(--green-soft); }
  .btn.small { padding: 9px 16px; font-size: .92rem; }
  .btn.block { width: 100%; }
  .btn.gold { background: var(--gold); color: #2b2100; box-shadow: 0 6px 16px rgba(217,168,38,.35); }
  .btn.gold:hover { background: #c4961f; }

  .state { text-align: center; color: var(--muted); padding: 40px 10px; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 10px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-radius: 26px; background: linear-gradient(160deg, #e3edfc 0%, #ffffff 62%); border: 1px solid var(--line); padding: 28px 22px 26px; display: grid; gap: 18px; box-shadow: var(--shadow); }
  .hero::before { content: ""; position: absolute; width: 360px; height: 360px; right: -140px; top: -140px; border-radius: 50%; background: radial-gradient(circle, rgba(217,168,38,.22), transparent 68%); pointer-events: none; }
  .hero::after { content: ""; position: absolute; width: 300px; height: 300px; left: -120px; bottom: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(29,95,216,.14), transparent 70%); pointer-events: none; }
  .hero > * { position: relative; z-index: 1; }
  .chip { display: inline-block; background: var(--gold-soft); color: #7a5a00; font-weight: 700; font-size: .8rem; padding: 6px 12px; border-radius: 99px; letter-spacing: .04em; border: 1px solid #f0dca0; }
  .hero h1 { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2.3rem, 9vw, 3.8rem); line-height: 1.03; color: var(--green-dark); margin: 12px 0 10px; letter-spacing: -.01em; }
  .hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, rgba(217,168,38,.55) 62%); padding: 0 4px; }
  .hero p.lead { margin: 0 0 18px; color: var(--muted); font-size: 1.04rem; max-width: 34ch; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; }
  .perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .perk { display: flex; align-items: center; gap: 7px; font-size: .86rem; font-weight: 600; color: var(--green-dark); background: #fff; border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; }
  .perk i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }

  .map-wrap { display: flex; flex-direction: column; align-items: center; }
  .sindh-map { width: min(330px, 80vw); height: auto; overflow: visible; animation: floaty 6s ease-in-out infinite; }
  .sindh-map .sheen { animation: sheen 5.5s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes sheen { 0% { transform: translateX(0); } 55%, 100% { transform: translateX(620px); } }
  .map-cap { margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; background: var(--green-dark); color: #fff; font-weight: 700; font-size: .85rem; padding: 7px 16px; border-radius: 99px; letter-spacing: .05em; }
  .map-cap b { color: var(--gold); }

  @media (min-width: 820px) {
    .hero { grid-template-columns: 1.1fr .9fr; align-items: center; padding: 44px 44px 40px; gap: 30px; }
    .sindh-map { width: 340px; }
  }

  /* Auth + steps */
  .below { display: grid; gap: 22px; margin-top: 22px; align-items: start; }
  @media (min-width: 820px) { .below { grid-template-columns: 1fr 1fr; } }
  .auth { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); scroll-margin-top: 80px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--green-soft); padding: 6px; gap: 6px; }
  .tab { appearance: none; border: 0; background: transparent; font: inherit; font-weight: 700; padding: 11px; cursor: pointer; color: var(--muted); border-radius: 12px; }
  .tab.on { color: #fff; background: var(--green); box-shadow: 0 4px 10px rgba(29,95,216,.25); }
  .auth form { padding: 18px 18px 22px; }
  .intro { color: var(--muted); margin: 0 0 14px; font-size: .95rem; }

  .steps { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; box-shadow: var(--shadow); }
  .steps h2 { margin: 0 0 14px; font-size: 1.1rem; color: var(--green-dark); }
  .step { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; }
  .step + .step { border-top: 1px dashed var(--line); }
  .num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; display: grid; place-items: center; }
  .step:nth-child(3) .num { background: var(--gold); color: #2b2100; }
  .step b { display: block; }
  .step span { color: var(--muted); font-size: .92rem; }

  /* Forms */
  .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 5px; }
  label .req { color: var(--danger); }
  input[type=text], input[type=tel], input[type=email], input[type=password], select, textarea { width: 100%; font: inherit; color: inherit; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px rgba(29,95,216,.16); }
  .field.invalid input, .field.invalid select, .field.invalid textarea, .field.invalid .file { border-color: var(--danger); }
  .err { color: var(--danger); font-size: .85rem; margin-top: 4px; display: none; }
  .field.invalid .err { display: block; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .showpw { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: .9rem; margin: -4px 0 14px; }
  .showpw input { width: 18px; height: 18px; accent-color: var(--green); }
  .form-msg { margin: 4px 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); display: none; font-weight: 500; }
  .form-msg.show { display: block; }
  .form-msg.good { background: #e6f5ec; color: var(--ok); }

  .forgot { text-align: right; margin: -6px 0 12px; }
  .linkbtn { appearance: none; border: 0; background: none; font: inherit; font-weight: 700; font-size: .9rem; color: var(--green); cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--green-dark); }

  /* App menu + pages */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(10,37,82,.08); }
  .tb { appearance: none; border: 0; background: none; font: inherit; font-size: .72rem; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border-radius: 12px; cursor: pointer; transition: background .15s, color .15s; }
  .tb svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tb.on { color: var(--green); background: var(--green-soft); }
  .tb.out { color: var(--danger); }
  @media (min-width: 820px) { .tabbar { left: 50%; right: auto; transform: translateX(-50%); bottom: 16px; width: min(560px, 92vw); border: 1px solid var(--line); border-radius: 20px; } }

  .ptitle { display: flex; align-items: center; gap: 12px; margin: 6px 0 16px; font-size: 1.25rem; font-weight: 800; color: var(--green-dark); }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--green); color: #fff; flex: none; box-shadow: 0 6px 14px rgba(29,95,216,.25); }
  .ico.gold { background: var(--gold); color: #2b2100; box-shadow: 0 6px 14px rgba(217,168,38,.3); }
  .ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .card-box { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .prof-head { display: flex; align-items: center; gap: 14px; padding: 18px; background: linear-gradient(135deg, var(--green-soft), #fff); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .prof-head .ico { width: 52px; height: 52px; border-radius: 16px; }
  .prof-head .ico svg { width: 28px; height: 28px; }
  .prof-head b { display: block; color: var(--green-dark); }
  .prof-head small { color: var(--muted); display: block; max-width: 30ch; }
  .status { margin-left: auto; font-size: .8rem; font-weight: 800; padding: 5px 12px; border-radius: 99px; background: var(--gold-soft); color: #7a5a00; border: 1px solid #f0dca0; }
  .status.ok { background: #e6f5ec; color: var(--ok); border-color: #bfe3cd; }
  #profileForm { padding: 18px; }
  .sec { margin: 22px 0 12px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--green); font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .sec:first-child { margin-top: 0; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .phone { display: flex; align-items: stretch; }
  .phone .pre { display: grid; place-items: center; padding: 0 14px; background: var(--green-soft); border: 1.5px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; font-weight: 800; color: var(--green-dark); }
  .phone input { border-radius: 0 12px 12px 0; }
  .field.invalid .phone .pre { border-color: var(--danger); }
  #msField { display: none; padding: 12px; background: var(--green-soft); border-radius: 12px; }
  #msField.show { display: block; animation: pop .18s ease-out; }

  .notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--gold-soft); border: 1px solid #f0dca0; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; }
  .notice b { display: block; color: #5c4300; }
  .notice span { color: #7a5a00; font-size: .9rem; }

  .app-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .app-item .t { font-weight: 800; color: var(--green-dark); }
  .app-item small { color: var(--muted); display: block; }
  .pill { font-size: .78rem; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: var(--gold-soft); color: #7a5a00; border: 1px solid #f0dca0; white-space: nowrap; }
  .pill.paid { background: #e6f5ec; color: var(--ok); border-color: #bfe3cd; }

  .sum { padding: 6px 20px 4px; }
  .sum-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .95rem; }
  .sum-row span { color: var(--muted); }
  .sum-row b { text-align: right; word-break: break-word; }
  .dlg-body { padding: 14px 20px 6px; color: var(--muted); }
  .dlg-actions { padding: 14px 20px 20px; }

  /* Dashboard */
  .dash { max-width: 760px; margin: 0 auto; }
  .whoami { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); color: #fff; border-radius: 20px; padding: 16px 18px; margin-bottom: 22px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .whoami::after { content: ""; position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgba(217,168,38,.35), transparent 70%); }
  .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: #2b2100; font-weight: 800; font-size: 1.2rem; display: grid; place-items: center; z-index: 1; }
  .who-t { flex: 1; min-width: 0; z-index: 1; }
  .whoami .n { font-weight: 800; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; }
  .whoami small { display: block; color: #b9cdf0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whoami .btn.ghost { color: #fff; border-color: rgba(255,255,255,.4); z-index: 1; }
  .whoami .btn.ghost:hover { background: rgba(255,255,255,.14); }
  .page-title { margin: 6px 0 16px; font-size: 1.25rem; font-weight: 800; color: var(--green-dark); display: flex; align-items: center; gap: 10px; }
  .page-title::before { content: ""; width: 5px; height: 22px; border-radius: 3px; background: var(--gold); }

  .ad-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 26px; box-shadow: var(--shadow); transition: transform .2s; }
  .ad-card:hover { transform: translateY(-3px); }
  .ad-card img { display: block; width: 100%; height: auto; background: var(--green-soft); }
  .ad-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .ad-foot .t { font-weight: 800; font-size: 1.05rem; color: var(--green-dark); }
  .deadline { display: inline-block; margin-top: 5px; font-size: .8rem; font-weight: 700; color: #7a5a00; background: var(--gold-soft); border: 1px solid #f0dca0; padding: 3px 10px; border-radius: 99px; }
  .deadline.closed { color: var(--danger); background: var(--danger-soft); border-color: #f4c9c6; }
  .btn.done-btn { background: var(--ok); }

  /* Dialog */
  dialog { border: 0; padding: 0; width: min(520px, 94vw); max-height: 92vh; border-radius: 20px; background: #fff; color: var(--ink); box-shadow: 0 24px 70px rgba(10,37,82,.4); }
  dialog::backdrop { background: rgba(10,37,82,.6); }
  dialog[open] { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; border-radius: 20px 20px 0 0; z-index: 2; }
  .dlg-head h2 { margin: 0; font-size: 1.15rem; color: var(--green-dark); }
  .dlg-head small { color: var(--muted); display: block; margin-top: 2px; }
  .x { appearance: none; border: 0; background: var(--green-soft); color: var(--green-dark); width: 36px; height: 36px; border-radius: 50%; font-size: 1.3rem; line-height: 1; cursor: pointer; flex: none; }
  #applyForm { padding: 16px 20px 22px; }
  #marksheetField { display: none; padding: 12px; background: var(--green-soft); border-radius: 12px; }
  #marksheetField.show { display: block; animation: pop .18s ease-out; }
  .file { background: #fff; border: 1.5px dashed var(--green); border-radius: 12px; padding: 10px; }
  .file input { width: 100%; font: inherit; }
  .preview { margin-top: 8px; max-width: 100%; max-height: 180px; border-radius: 8px; display: none; border: 1px solid var(--line); }
  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; min-width: 0; padding-left: 12px; padding-right: 12px; white-space: normal; }
  @media (max-width: 520px) { .ad-foot .btn { width: 100%; } }
  .done { padding: 32px 22px 26px; text-align: center; }
  .done .tick { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 1.9rem; }
  .done h2 { margin: 0 0 6px; color: var(--green-dark); }
  .done p { color: var(--muted); margin: 0 0 18px; }

  footer { background: var(--green-dark); color: #b9cdf0; text-align: center; font-size: .9rem; padding: 22px 16px; }
  footer b { color: #fff; }
  footer .gold { color: var(--gold); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }

  /* ===== v3: splash, transitions, slip page, photo ===== */
  #splash { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 36%, #1a4aa3 0%, #0a2552 55%, #06173a 100%); color: #fff; overflow: hidden; transition: opacity .7s ease, transform .7s ease; cursor: pointer; }
  #splash.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .sp-ring { position: absolute; width: 130vmin; height: 130vmin; border-radius: 50%; border: 1.5px solid rgba(217,168,38,.25); animation: spRing 3s ease-out both; }
  .sp-ring.r2 { animation-delay: .35s; border-color: rgba(255,255,255,.14); }
  @keyframes spRing { from { transform: scale(.2); opacity
